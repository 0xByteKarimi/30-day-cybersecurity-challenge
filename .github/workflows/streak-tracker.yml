name: Update Streak Tracker

on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'resources/streak-tracker.md'

permissions:
  contents: write

jobs:
  update-streak:
    name: Parse Commit & Update Tracker
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip streak]')"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse commit message for completed day
        id: parse
        run: |
          MSG=$(git log -1 --pretty=%B)
          echo "Commit message: $MSG"

          # Match "Day 5", "day 5", "Day5", "DAY 05", etc.
          if [[ "$MSG" =~ [Dd][Aa][Yy][[:space:]]*([0-9]{1,2}) ]]; then
            DAY="${BASH_REMATCH[1]}"
            # Strip leading zeros (e.g., 05 -> 5)
            DAY=$((10#$DAY))

            if [ "$DAY" -ge 1 ] && [ "$DAY" -le 30 ]; then
              echo "day=$DAY" >> $GITHUB_OUTPUT
              echo "✅ Detected completed Day $DAY"
            else
              echo "⚠️ Day $DAY out of range (1-30), skipping"
            fi
          else
            echo "ℹ️ No 'Day X' pattern found, skipping"
          fi

      - name: Update streak tracker
        if: steps.parse.outputs.day != ''
        run: |
          DAY=${{ steps.parse.outputs.day }}
          FILE="resources/streak-tracker.md"

          if [ ! -f "$FILE" ]; then
            echo "❌ $FILE not found"
            exit 1
          fi

          # Replace "- [ ] Day X " with "- [x] Day X "
          sed -i "s/- \[ \] Day $DAY /- [x] Day $DAY /" "$FILE"

          # Update progress counter
          DONE=$(grep -c '^\- \[x\] Day' "$FILE" || echo 0)
          sed -i "s/\*\*Progress:\*\* .*\*\*Progress:\*\* $DONE\/30 days completed/" "$FILE"

          echo "✅ Marked Day $DAY as complete (progress: $DONE/30)"

      - name: Commit and push changes
        if: steps.parse.outputs.day != ''
        run: |
          DAY=${{ steps.parse.outputs.day }}
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet resources/streak-tracker.md; then
            echo "ℹ️ No changes to commit"
            exit 0
          fi

          git add resources/streak-tracker.md
          git commit -m "chore: auto-check Day $DAY ✅ [skip streak]"
          git push
