name: Spell Check

on:
  push:
    branches: [ main ]
    paths:
      - '**.md'
      - '.cspell.json'
  pull_request:
    branches: [ master ]
    paths:
      - '**.md'

jobs:
  spellcheck:
    name: Check Spelling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run cspell
        uses: streetsidesoftware/cspell-action@v6
        with:
          files: '**/*.md'
          config: '.cspell.json'
          incremental_files_only: false
